name: Publish to PyPI & GitHub Releases

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
      version: ${{ steps.detect.outputs.version }}
      pypi_version: ${{ steps.detect.outputs.pypi_version }}
      registry_publish: ${{ steps.registro.outputs.registry_publish }}
      server_name: ${{ steps.registro.outputs.server_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Detectar versión nueva
        id: detect
        run: |
          LOCAL_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PYPI_VERSION=$(curl -s https://pypi.org/pypi/openlegal-chile/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "0.0.0")
          echo "local=${LOCAL_VERSION}"
          echo "pypi=${PYPI_VERSION}"
          echo "version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pypi_version=${PYPI_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "release" ] || [ "$LOCAL_VERSION" != "$PYPI_VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo ">>> Publicacion activada (local=${LOCAL_VERSION}, PyPI=${PYPI_VERSION})"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo ">>> Sin version nueva (local=${LOCAL_VERSION} == PyPI=${PYPI_VERSION}). Nada que publicar."
          fi

      # El registro oficial de MCP se pone al día por su cuenta: se publica cuando NO tiene esta
      # versión, aunque PyPI ya la tenga. Medido el 07-10-2026: el registro seguía en 1.5.1
      # («55 herramientas», 13-09-2026) con PyPI en 1.13.0, porque este workflow nunca le mandó
      # server.json. Solo un 404 cuenta como «falta»: si el registro no responde, se reintenta en
      # el próximo push en vez de publicar a ciegas.
      - name: Detectar si el registro MCP tiene esta versión
        id: registro
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          NAME=$(python3 -c "import json; print(json.load(open('server.json', encoding='utf-8'))['name'])")
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${NAME/\//%2F}/versions/${VERSION}" || true)
          echo "server_name=${NAME}" >> "$GITHUB_OUTPUT"
          if [ "$CODIGO" = "404" ]; then
            echo "registry_publish=true" >> "$GITHUB_OUTPUT"
            echo ">>> El registro MCP no tiene ${NAME} ${VERSION}: se publicará"
          else
            echo "registry_publish=false" >> "$GITHUB_OUTPUT"
            echo ">>> Registro MCP: HTTP ${CODIGO} para ${VERSION} (200 = ya publicada). No se publica."
          fi

  build-and-publish:
    needs: detect-version
    if: needs.detect-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            python -m twine upload dist/* --skip-existing
          else
            echo "PYPI_API_TOKEN no configurado en los Secretos de GitHub. Omitiendo subida a PyPI."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" dist/* \
              --title "Open Legal Chile v${VERSION}" \
              --generate-notes \
              --target main
            echo ">>> Release v${VERSION} creado"
          else
            echo ">>> El release v${VERSION} ya existe"
          fi

  publish-mcp-registry:
    # Job aparte y tolerante: cuando corre, el paquete ya está en PyPI y el release creado, así que
    # un rechazo del registro (que está en preview) no puede deshacer ni bloquear nada de eso.
    #
    # Solo main y release: una versión publicada en el registro NO se puede cambiar («The version
    # string MUST be unique… cannot be changed», versioning.mdx), así que un workflow_dispatch
    # desde una rama cualquiera dejaría fija una versión que después no se corrige. Y solo se
    # acepta 'success' o 'skipped' de build-and-publish: 'cancelled' o 'failure' no (con
    # `!= 'failure'` pasaba 'cancelled'). 'skipped' es el caso en que PyPI ya tenía la versión y el
    # registro va atrasado.
    needs: [detect-version, build-and-publish]
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'release') && needs.detect-version.outputs.registry_publish == 'true' && contains(fromJSON('["success","skipped"]'), needs.build-and-publish.result) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # login github-oidc: el registro concede io.github.<dueño del repo>/* (sin secretos)
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
      SERVER_NAME: ${{ needs.detect-version.outputs.server_name }}
      BUILD_RESULT: ${{ needs.build-and-publish.result }}

    steps:
      - uses: actions/checkout@v7

      - name: server.json declara la versión que se publica
        run: |
          python3 - <<'PY'
          import json, os
          s = json.load(open("server.json", encoding="utf-8"))
          v = os.environ["VERSION"]
          assert s["version"] == v and all(p["version"] == v for p in s["packages"]), (s["version"], v)
          print(f"server.json {s['name']} {v}")
          PY

      # El registro valida el paquete contra PyPI (versión publicada y `mcp-name:` en la
      # descripción, que es el README). Recién subido, PyPI puede tardar en servir la versión: se
      # espera hasta 10 minutos (20 intentos cada 30 s) solo si este mismo run la subió
      # (BUILD_RESULT=success). Si build-and-publish se omitió, PyPI ya la tenía o no la va a
      # tener: un solo intento, en vez de esperar 10 minutos inútiles en cada push.
      - name: Esperar a que PyPI sirva la versión
        run: |
          INTENTOS=1
          [ "$BUILD_RESULT" = "success" ] && INTENTOS=20
          for intento in $(seq 1 "$INTENTOS"); do
            if curl -fsS -o /dev/null --max-time 30 "https://pypi.org/pypi/openlegal-chile/${VERSION}/json"; then
              echo ">>> PyPI sirve openlegal-chile ${VERSION} (intento ${intento})"
              exit 0
            fi
            [ "$intento" -lt "$INTENTOS" ] && sleep 30
          done
          echo "::warning::PyPI no sirve openlegal-chile ${VERSION} (${INTENTOS} intento(s), build-and-publish=${BUILD_RESULT}): no se publica en el registro MCP."
          exit 1

      # Última versión a propósito: el registro rechaza binarios viejos («invalid audience», según
      # su guía de GitHub Actions). La integridad se verifica contra el checksums del mismo release.
      - name: Instalar mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo modelcontextprotocol/registry --json tagName --jq .tagName)
          gh release download "$TAG" --repo modelcontextprotocol/registry \
            --pattern 'mcp-publisher_linux_amd64.tar.gz' --pattern 'registry_*_checksums.txt'
          sha256sum --check --ignore-missing registry_*_checksums.txt
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Login en el registro MCP (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publicar server.json
        run: |
          if ./mcp-publisher publish server.json > publicar.log 2>&1; then
            cat publicar.log
            echo "::notice::Registro MCP: ${SERVER_NAME} ${VERSION} publicado."
          elif grep -qiE "duplicate version|already exists" publicar.log; then
            cat publicar.log
            echo "::notice::El registro MCP ya tenía ${SERVER_NAME} ${VERSION}."
          else
            cat publicar.log
            echo "::warning::El registro MCP rechazó server.json. PyPI y el release no se afectan."
            exit 1
          fi

      # El registro puede tardar unos segundos en servir lo recién publicado: 3 intentos cada 10 s.
      - name: El registro sirve la versión publicada
        run: |
          for intento in 1 2 3; do
            if curl -fsS --max-time 30 \
                "https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER_NAME/\//%2F}/versions/${VERSION}" \
                | python3 -c "import json, os, sys; assert json.load(sys.stdin)['server']['version'] == os.environ['VERSION']"; then
              echo ">>> El registro MCP sirve ${SERVER_NAME} ${VERSION} (intento ${intento})"
              exit 0
            fi
            [ "$intento" -lt 3 ] && sleep 10
          done
          echo "::warning::El registro MCP no sirve ${SERVER_NAME} ${VERSION} tras 3 intentos."
          exit 1
