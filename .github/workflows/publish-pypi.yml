name: Publish to PyPI & GitHub Releases

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
      version: ${{ steps.detect.outputs.version }}
      pypi_version: ${{ steps.detect.outputs.pypi_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar versión nueva
        id: detect
        run: |
          LOCAL_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PYPI_VERSION=$(curl -s https://pypi.org/pypi/openlegal-chile/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "0.0.0")
          echo "local=${LOCAL_VERSION}"
          echo "pypi=${PYPI_VERSION}"
          echo "version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pypi_version=${PYPI_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "release" ] || [ "$LOCAL_VERSION" != "$PYPI_VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo ">>> Publicacion activada (local=${LOCAL_VERSION}, PyPI=${PYPI_VERSION})"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo ">>> Sin version nueva (local=${LOCAL_VERSION} == PyPI=${PYPI_VERSION}). Nada que publicar."
          fi

  build-and-publish:
    needs: detect-version
    if: needs.detect-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            python -m twine upload dist/* --skip-existing
          else
            echo "PYPI_API_TOKEN no configurado en los Secretos de GitHub. Omitiendo subida a PyPI."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" dist/* \
              --title "Open Legal Chile v${VERSION}" \
              --generate-notes \
              --target main
            echo ">>> Release v${VERSION} creado"
          else
            echo ">>> El release v${VERSION} ya existe"
          fi
