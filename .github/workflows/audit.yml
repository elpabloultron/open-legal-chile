name: Open Legal Chile 360° Audit & Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'  # Ejecución semanal preventiva


# Un push nuevo a la misma rama de un PR cancela la corrida anterior: ahorra runners y evita que
# varias matrices en paralelo consulten la BCN a la vez (respondía 429). En main no se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Security, Quality & Anti-Bloat Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies and Audit Tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          pip install -e ".[dev,audit]"

      - name: 1. Dependency Vulnerability Scan (pypa/pip-audit)
        run: |
          pip-audit .

      - name: 2. SAST Security Scan (PyCQA/bandit)
        run: |
          bandit -r . -x ./tests,./.venv,./doctrina_raw -s B101,B110,B310,B311,B404,B603

      - name: 3. Semantic SAST Scan (semgrep/semgrep)
        run: |
          semgrep scan --config "p/security-audit" --config "p/python" --exclude tests --exclude .venv --exclude doctrina_raw --exclude exports --metrics=off --error

      - name: 4. Secret & Credential Leak Audit (Yelp/detect-secrets)
        run: |
          detect-secrets scan --exclude-files '(\.git|\.venv|doctrina_raw|exports|\.pytest_cache|skills-lock\.json|docs/medicion_tokens\..*|mapa_corpus/puntero\.json|tests/fixtures/mapa/.*)'

      - name: 5. Strict Type Checking (python/mypy)
        run: |
          mypy --ignore-missing-imports --explicit-package-bases --exclude '(\.venv|doctrina_raw|brag-output)' .

      - name: 6. Code Quality & Formatting (astral-sh/ruff)
        run: |
          ruff check .

      - name: 7. Anti-Bloat & Dead Code Audit (Ponytail & Vulture)
        run: |
          vulture . --min-confidence 80 --exclude .venv,tests

      - name: 8. Maintainability & Cyclomatic Complexity (rubik/radon)
        run: |
          radon mi . -s -e ".venv/*,doctrina_raw/*"

      # Las normas de la BCN que guarda el job bcn-cache de ci.yml (ver allí por qué): la suite también
      # las consulta y corre a la vez que la matriz. Sólo se restauran —la más reciente del PR o de
      # main—, recién aquí, después de los escáneres, y el touch las deja frescas para la suite.
      - name: Clave de la caché de la BCN
        id: clave
        run: echo "blob=$(git rev-parse HEAD:bcn_connector.py)" >> "$GITHUB_OUTPUT"

      - name: Restaurar las normas de la BCN
        uses: actions/cache/restore@v4
        with:
          path: bcn_cache
          key: bcn-${{ steps.clave.outputs.blob }}-audit-${{ github.run_id }}
          restore-keys: |
            bcn-${{ steps.clave.outputs.blob }}-
          enableCrossOsArchive: true

      - name: Las normas restauradas no vencen durante la suite
        run: if [ -d bcn_cache ]; then find bcn_cache -type f -exec touch {} +; fi

      - name: 9. Regression Test Suite (pytest-dev/pytest)
        run: |
          pytest tests/ -v
