name: Open Legal Chile 360° Audit & Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'  # Ejecución semanal preventiva

jobs:
  audit:
    name: Security, Quality & Anti-Bloat Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies and Audit Tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          pip install -e ".[dev,audit]"

      - name: 1. Dependency Vulnerability Scan (pypa/pip-audit)
        run: |
          pip-audit

      - name: 2. SAST Security Scan (PyCQA/bandit)
        run: |
          bandit -r . -x ./tests,./.venv,./doctrina_raw -s B101,B110,B310,B311,B404,B603

      - name: 3. Semantic SAST Scan (semgrep/semgrep)
        run: |
          semgrep scan --config "p/security-audit" --config "p/python" --exclude tests --exclude .venv --exclude doctrina_raw --exclude exports --metrics=off --error

      - name: 4. Secret & Credential Leak Audit (Yelp/detect-secrets)
        run: |
          detect-secrets scan --exclude-files '(\.git|\.venv|doctrina_raw|exports|\.pytest_cache|skills-lock\.json)'

      - name: 5. Strict Type Checking (python/mypy)
        run: |
          mypy --ignore-missing-imports --explicit-package-bases --exclude '(\.venv|doctrina_raw)' .

      - name: 6. Code Quality & Formatting (astral-sh/ruff)
        run: |
          ruff check .

      - name: 7. Anti-Bloat & Dead Code Audit (Ponytail & Vulture)
        run: |
          vulture . --min-confidence 80 --exclude .venv,tests

      - name: 8. Maintainability & Cyclomatic Complexity (rubik/radon)
        run: |
          radon mi . -s -e ".venv/*,doctrina_raw/*"

      - name: 9. Regression Test Suite (pytest-dev/pytest)
        run: |
          pytest tests/ -v
