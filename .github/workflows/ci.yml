name: Open Legal Chile CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30        # un cuelgue no debe quemar 46 minutos (Windows/3.10, 2026-09-25)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Herramientas del sistema (poppler para pdftotext)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run MCP Server & State Connectors Test Suite (Parallel with xdist)
        run: |
          python -m pytest tests/ -n auto -q

  paquete-limpio:
    # La instalación ES el producto: `pip install` tiene que dejar todo andando (OCR incluido) y el
    # MCP tiene que exponer las herramientas del protocolo sin ningún paso manual por terminal.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar el paquete como lo haría un usuario (venv limpio, sin -e)
        run: |
          python -m venv /tmp/limpio
          /tmp/limpio/bin/python -m pip install --upgrade pip
          /tmp/limpio/bin/pip install .

      - name: El doctor mide de verdad y no encuentra errores (OCR incluido)
        run: |
          cd /tmp
          /tmp/limpio/bin/openlegal doctor | tee doctor.txt
          ! grep -q "❌" doctor.txt
          grep -i "^ .*ocr" doctor.txt | grep -q "rapidocr"

      - name: El MCP arranca y expone el protocolo completo
        run: |
          cd /tmp
          python - <<'PY'
          import json, subprocess

          peticiones = "\n".join([
              json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                          "params": {"protocolVersion": "2024-11-05", "capabilities": {}}}),
              json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list"}),
              json.dumps({"jsonrpc": "2.0", "id": 3, "method": "tools/call",
                          "params": {"name": "skills_listar", "arguments": {}}}),
              json.dumps({"jsonrpc": "2.0", "id": 4, "method": "resources/read",
                          "params": {"uri": "openlegal://reglas/citacion"}}),
          ]) + "\n"
          # openlegal-chile: alias con el nombre del paquete (uvx openlegal-chile / registro MCP)
          corrida = subprocess.run(["/tmp/limpio/bin/openlegal-chile"], input=peticiones,
                                   capture_output=True, text=True, timeout=180)
          respuestas = {r.get("id"): r for r in (json.loads(l) for l in corrida.stdout.splitlines()
                                                  if l.strip().startswith("{"))}
          herramientas = [t["name"] for t in respuestas[2]["result"]["tools"]]
          catalogo = json.loads(respuestas[3]["result"]["content"][0]["text"])
          assert respuestas[1]["result"].get("instructions"), "initialize sin instructions"
          # Skills, agentes y protocolo viajan como data-files (hasta 1.13.0 el wheel no los llevaba)
          assert len(catalogo["skills"]) >= 18, catalogo
          assert len(catalogo["agentes"]) >= 19, catalogo
          assert "Protocolo no disponible" not in respuestas[4]["result"]["contents"][0]["text"]

          assert len(herramientas) == 87, f"{len(herramientas)} herramientas en el paquete instalado"
          for nombre in ("consulta_maestra", "cita_texto", "huggingface_search_dataset", "bcn_get_codigo",
                         "suite_doctor", "busqueda_universal", "skills_listar", "skill_ver",
                         "critique_documento", "generar_documento", "entrevista_estudio",
                         "ocr_plan_documento", "suite_instalar"):
              assert nombre in herramientas, f"falta {nombre}"
          print(f"MCP OK: {len(herramientas)} herramientas")
          PY

      - name: Un solo comando deja el harness configurado y verificado (openlegal instalar)
        run: |
          mkdir -p /tmp/proyecto/.claude && cd /tmp/proyecto
          HOME=/tmp/casa_vacia /tmp/limpio/bin/openlegal instalar --json > instalar.json
          python3 - <<'PY'
          import json, pathlib

          texto = open("/tmp/proyecto/instalar.json", encoding="utf-8").read()
          datos = json.loads(texto[texto.index("{"):])
          assert datos["harnesses"] == ["claude-code"], datos
          assert datos["doctor"]["estado"] in ("ok", "degradado"), datos
          assert datos["herramientas"] == 87, datos
          assert pathlib.Path("/tmp/proyecto/.mcp.json").exists(), "no escribió la configuración"
          print("instalar OK:", datos["harnesses"], "·", datos["doctor"]["estado"])
          PY

  harness:
    # Lo que ven los harness de verdad: el plugin y el marketplace de Claude Code validados por su
    # CLI, la extensión de Gemini CLI validada por la suya, y el servidor recorrido con el cliente
    # oficial del SDK de MCP. Hasta 1.13.0 el plugin cargaba 0 skills y 0 agentes sin que nada fallara.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar la suite y el SDK oficial de MCP
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "mcp>=1.10"

      - name: Cliente oficial del SDK de MCP, esquemas portables, plugin y protocolo
        run: |
          python -m pytest -q tests/test_cliente_mcp_oficial.py tests/test_protocolo_mcp.py \
            tests/test_esquemas_portables.py tests/test_plugin_claude.py tests/test_integrar_harness.py

      - name: Los agentes del plugin están sincronizados con los JSON
        run: python scripts/generar_agentes_plugin.py --check

      - name: Claude Code valida el plugin y el marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .claude-plugin/plugin.json | tee plugin.txt
          claude plugin validate .claude-plugin/marketplace.json | tee marketplace.txt
          # El único aviso admitido es CLAUDE.md en la raíz (es contexto del repo, no del plugin).
          ! grep -E "Error|error:|×" plugin.txt marketplace.txt

      - name: Gemini CLI valida la extensión
        run: npx -y @google/gemini-cli@latest extensions validate .
