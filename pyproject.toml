[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlegal-chile"
version = "1.2.0"
description = "Suite de Inteligencia Jurídica y Servidor MCP para el Derecho Continental de la República de Chile"
readme = "README.md"
authors = [
  { name = "Pablo Benavides Jorquera / Open Legal Chile Contributors" }
]
license = "Apache-2.0"
keywords = ["chile", "legal", "law", "mcp", "ai", "bcn", "cgr", "dt", "ojv", "civil-law"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",

  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28.0",
  "beautifulsoup4>=4.11.0",
  "defusedxml>=0.7.1",
  "pymupdf>=1.23.0",
  "markdown-pdf>=1.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio"
]
audit = [
  "bandit>=1.7.5",
  "pip-audit>=2.7.0",
  "ruff>=0.4.0",
  "radon>=6.0.0",
  "vulture>=2.11",
  "mypy>=1.10.0",
  "detect-secrets>=1.5.0",
  "semgrep>=1.70.0"
]

[project.scripts]
openlegal = "openlegal:main"
openlegal-mcp = "mcp_server:main"

[project.urls]
"Homepage" = "https://github.com/elpabloultron/open-legal-chile"
"Bug Tracker" = "https://github.com/elpabloultron/open-legal-chile/issues"
"Source Code" = "https://github.com/elpabloultron/open-legal-chile"

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"openlegal-chile" = [".env.example", "mcp_config.json", "smithery.yaml"]

[tool.setuptools.packages.find]
include = ["connectors*", "domain*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "doctrina_raw",
    "exports"
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E722", "E402", "W293", "W291", "F401", "B008", "B904", "B006", "B009"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "doctrina_raw", "exports"]
skips = ["B101", "B311"]

[tool.vulture]
min_confidence = 80
exclude = [".venv", "tests"]
