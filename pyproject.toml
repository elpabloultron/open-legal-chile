[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlegal-chile"
version = "1.13.1"
description = "Suite de Inteligencia Jurídica y Servidor MCP para el Derecho Continental de la República de Chile"
readme = "README.md"
authors = [
  { name = "Pablo Benavides Jorquera / Open Legal Chile Contributors" }
]
license = "Apache-2.0"
keywords = ["chile", "legal", "law", "mcp", "ai", "bcn", "cgr", "dt", "ojv", "civil-law"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",

  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28.0",
  "beautifulsoup4>=4.11.0",
  "defusedxml>=0.7.1",
  "pymupdf>=1.23.0",
  "markdown-pdf>=1.3.0",
  "networkx>=3.0",
  # PageRank real para graphify_god_nodes. NetworkX lo necesita vía numpy + scipy: sin
  # ellos el motor caía en silencio a un grado de conexión que igual informaba como
  # 'pagerank', y dos máquinas distintas devolvían órdenes distintos sin aviso.
  "numpy>=1.26",
  "scipy>=1.11",
  # Documentos de trabajo en Word (.docx): los escritos se entregan editables, no en PDF.
  "python-docx>=1.1.0",
  # Sincronización y publicación con Hugging Face Datasets Hub
  "huggingface-hub>=0.20.0",
  # OCR SIEMPRE incluido: leer un escaneo o una foto no puede depender de un paso manual.
  # Antes vivía en el extra [ocr] y quien instalaba el paquete se quedaba sin leer PDFs sin capa
  # de texto. La regla del producto: «siempre se debe instalar todo».
  "rapidocr-onnxruntime>=1.2.0"
  ]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio",
  "pytest-xdist>=3.5.0"
]
audit = [
  "bandit>=1.7.5",
  "pip-audit>=2.7.0",
  "ruff>=0.4.0",
  "radon>=6.0.0",
  "vulture>=2.11",
  "mypy>=1.10.0",
  "detect-secrets>=1.5.0",
  "semgrep>=1.70.0"
]

[project.scripts]
openlegal = "openlegal:main"
openlegal-mcp = "mcp_server:main"
# Mismo nombre que el paquete: `uvx openlegal-chile` (y los clientes que leen server.json del
# registro MCP) arrancan el servidor sin tener que saber que el ejecutable se llama openlegal-mcp.
openlegal-chile = "mcp_server:main"

[project.urls]
"Homepage" = "https://github.com/elpabloultron/open-legal-chile"
"Bug Tracker" = "https://github.com/elpabloultron/open-legal-chile/issues"
"Source Code" = "https://github.com/elpabloultron/open-legal-chile"

[tool.setuptools]
include-package-data = true

# Los módulos raíz se declaran ACÁ: es la lista que el build usa de verdad.
# Un módulo nuevo sin declarar no viaja al wheel y el paquete instalado revienta al importar
# (pasó en 1.7.0: el MCP no arrancaba por `docx_compiler` ausente, y `diagnostico`,
# `citas_legales`, `integraciones_harness`, `case_intake` tampoco iban en el wheel).
# `tests/test_empaquetado.py` lo impide: si agregás un .py en la raíz, tiene que estar acá.
py-modules = [
    "academia_judicial_connector",
    "agents_runtime",
    "ambiental_connector",
    "bcn_connector",
    "case_graph",
    "case_intake",
    "case_workspace",
    "cbr_titles",
    "cgr_connector",
    "chat_engine",
    "citas_legales",
    "clinica_juridica",
    "cmf_connector",
    "cne_connector",
    "cold_start",
    "config",
    "critique",
    "diagnostico",
    "dictamen2md",
    "dictamenes_parser",
    "doc2md_ingestor",
    "docket_watcher",
    "doctrina_connector",
    "docx_compiler",
    "dt_connector",
    "entes_publicos",
    "examen_grado",
    "exporters",
    "forensic_ocr",
    "grafo_vinculos",
    "grafo_vista",
    "hf_cache_index",
    "infoprobidad_connector",
    "informe_derecho",
    "ingesta_fuentes",
    "integraciones_harness",
    "legal_canvas",
    "legal_graphify",
    "legal_open_jev",
    "mcp_server",
    "modulo_ambiental",
    "notebooklm_connector",
    "ocr_decision",
    "online_library_sync",
    "openlegal",
    "panel_expertos_connector",
    "pdf_dossier_compiler",
    "pjud_connector",
    "privacidad_inapi",
    "recurso_proteccion",
    "recursos",
    "resolucion_administrativa2md",
    "resoluciones_parser",
    "sentencia2md",
    "sentencias_parser",
    "sii_connector",
    "stats_tracker",
    "tdlc_connector",
    "tribunales_ambientales_connector",
    "update_checker",
    "vector_engine",
]

[tool.setuptools.data-files]
"openlegal-chile" = [".env.example", "mcp_config.json", "smithery.yaml"]
# Recursos que no son código y que las herramientas leen (skills_listar, skill_ver, agent_list y los
# recursos openlegal://reglas/*). recursos.ruta_recurso() los busca en <prefijo>/share/openlegal-chile.
# Una entrada por skill: data-files aplana las carpetas. tests/test_empaquetado.py exige que cada
# carpeta de .agents/skills/ tenga la suya.
"share/openlegal-chile" = ["AGENTS.md"]
"share/openlegal-chile/agents" = ["agents/*.json", "agents/*.md"]
"share/openlegal-chile/docs" = ["docs/integracion-harness.md"]
"share/openlegal-chile/.agents/skills/chilean-administrative-legal" = [".agents/skills/chilean-administrative-legal/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-case-intake" = [".agents/skills/chilean-case-intake/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-contract-legal" = [".agents/skills/chilean-contract-legal/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-corporate-legal" = [".agents/skills/chilean-corporate-legal/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-dossier-assembly" = [".agents/skills/chilean-dossier-assembly/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-employment-legal" = [".agents/skills/chilean-employment-legal/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-energy-legal" = [".agents/skills/chilean-energy-legal/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-environmental-legal" = [".agents/skills/chilean-environmental-legal/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-forensic-evidence" = [".agents/skills/chilean-forensic-evidence/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-litigation-legal" = [".agents/skills/chilean-litigation-legal/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-notebooklm-grounding" = [".agents/skills/chilean-notebooklm-grounding/SKILL.md"]
"share/openlegal-chile/.agents/skills/chilean-probity-investigation" = [".agents/skills/chilean-probity-investigation/SKILL.md"]
"share/openlegal-chile/.agents/skills/ponytail" = [".agents/skills/ponytail/SKILL.md"]
"share/openlegal-chile/.agents/skills/ponytail-audit" = [".agents/skills/ponytail-audit/SKILL.md"]
"share/openlegal-chile/.agents/skills/ponytail-debt" = [".agents/skills/ponytail-debt/SKILL.md"]
"share/openlegal-chile/.agents/skills/ponytail-gain" = [".agents/skills/ponytail-gain/SKILL.md"]
"share/openlegal-chile/.agents/skills/ponytail-help" = [".agents/skills/ponytail-help/SKILL.md"]
"share/openlegal-chile/.agents/skills/ponytail-review" = [".agents/skills/ponytail-review/SKILL.md"]

[tool.setuptools.packages.find]
include = ["connectors*", "domain*", "doctrina*", "data*", "servidor*"]
namespaces = true

# El corpus doctrinal y el grafo viajan DENTRO del paquete. Antes no: el wheel publicado en
# PyPI solo llevaba los módulos, así que quien hacía `pip install` recibía las 64 herramientas
# con graphify_* respondiendo "no encontrado" a todo y doctrina_search sin índice. Se declaran
# como paquetes de datos para que queden junto a los módulos en site-packages, que es donde el
# motor los busca (BASE_DIR/doctrina y BASE_DIR/data).
[tool.setuptools.package-data]
doctrina = ["**/*.md"]
data = ["**/*.json", "**/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "doctrina_raw",
    "exports"
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E722", "E402", "W293", "W291", "F401", "B008", "B904", "B006", "B009"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "doctrina_raw", "exports"]
skips = ["B101", "B311"]

[tool.vulture]
min_confidence = 80
exclude = [".venv", "tests"]
