<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Legal Chile — presentación</title>
<style>
  :root{
    --tinta:#0E1621; --papel:#FBFAF7; --bronce:#A67C2E; --bronce2:#C9A24A;
    --gris:#5C6673; --linea:#E4DFD4; --azul:#2E5D8A; --verde:#1E7A5A; --rojo:#8F2F2F;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);overflow:hidden}
  #barra{position:fixed;top:0;left:0;right:0;height:2px;background:rgba(14,22,33,.08);z-index:50}
  #progreso{height:100%;width:0;background:var(--bronce);transition:width .5s cubic-bezier(.2,.7,.2,1)}
  #controles{position:fixed;bottom:14px;right:18px;display:flex;align-items:center;gap:10px;z-index:50;font-size:12px;color:var(--gris)}
  #controles button{border:1px solid var(--linea);background:transparent;color:inherit;border-radius:9px;padding:5px 11px;font:inherit;cursor:pointer;transition:border-color .25s}
  #controles button:hover{border-color:var(--bronce)}
  #puntos{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:50}
  #puntos i{width:5px;height:5px;border-radius:50%;background:var(--linea);cursor:pointer;transition:background .3s, transform .3s}
  #puntos i.hoy{background:var(--bronce);transform:scale(1.4)}
  .pista{position:fixed;top:16px;right:18px;z-index:60;font-size:11.5px;color:var(--gris);border:1px solid var(--linea);border-radius:20px;padding:6px 13px;background:var(--papel);opacity:0;transition:opacity .8s}
  .pista.ver{opacity:1}

  .slide{position:fixed;inset:0;display:none;flex-direction:column;padding:clamp(28px,5vh,58px) clamp(28px,6vw,96px) clamp(50px,6.6vh,70px)}
  .slide.activa{display:flex}
  .slide.oscura{background:var(--tinta);color:#EFEBE2}
  .slide.oscura .gris{color:#9AA7B4}
  .ceja{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronce);display:flex;align-items:center;gap:14px;margin-bottom:1.4vh}
  .ceja::before{content:"";width:30px;height:1px;background:var(--bronce);display:block}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,6.4vw,84px);line-height:1.02;letter-spacing:-.015em;margin:0}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.3vw,46px);line-height:1.08;letter-spacing:-.01em;margin:0}
  h3{font-size:15px;margin:0 0 6px;font-weight:700}
  p{font-size:clamp(13px,1.3vw,16.5px);line-height:1.58;color:var(--gris);margin:0}
  .gris{color:var(--gris)}
  .cuerpo{margin-top:2.2vh;flex:1;display:flex;flex-direction:column;gap:1.8vh;min-height:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tarjeta{border:1px solid var(--linea);border-radius:13px;padding:15px 17px;background:#fff}
  .oscura .tarjeta{background:rgba(255,255,255,.04);border-color:rgba(239,235,226,.18)}
  .tarjeta b{font-size:14px}
  .tarjeta p{margin-top:5px;font-size:12.6px}
  .acento{border-left:3px solid var(--bronce)}
  .num{font-family:var(--serif);font-size:clamp(28px,3.3vw,48px);line-height:1;font-variant-numeric:tabular-nums}
  .num small{display:block;font-family:var(--sans);font-size:12px;color:var(--gris);margin-top:7px;line-height:1.42;font-weight:400}
  .serif{font-family:var(--serif)}
  ul.lista{margin:0;padding:0;list-style:none}
  ul.lista li{padding:6px 0 6px 18px;position:relative;font-size:clamp(12.6px,1.2vw,15.5px);color:var(--gris);border-bottom:1px solid rgba(228,223,212,.55)}
  ul.lista li:last-child{border-bottom:0}
  ul.lista li::before{content:"";position:absolute;left:0;top:14px;width:7px;height:1px;background:var(--bronce)}
  ul.lista li b{color:var(--tinta)}
  .a{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
  .a.on{opacity:1;transform:none}
  .regla{height:1px;background:var(--bronce);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .regla.on{width:86px}
  .fila{display:flex;align-items:center;gap:12px;margin:9px 0}
  .fila .etq{width:150px;font-size:13px;color:var(--gris)}
  .pista-bar{flex:1;height:10px;background:rgba(14,22,33,.06);border-radius:6px;overflow:hidden}
  .barra-i{height:100%;width:0;border-radius:6px;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
  .barra-i.b1{background:#C9D4E0}.barra-i.b2{background:var(--azul)}
  .fila .val{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--tinta)}
  canvas.red{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .encima{position:relative;z-index:1}
  .paso{opacity:.22;transition:opacity .5s, transform .5s;transform:translateY(4px)}
  .paso.hoy{opacity:1;transform:none}
  .flecha{color:var(--linea);font-size:20px;transition:color .5s}
  .flecha.hoy{color:var(--bronce)}
  .chip{border:1px solid var(--linea);border-radius:9px;padding:6px 11px;font-size:12px;background:#fff;display:inline-flex;gap:6px;align-items:center}
  .chip.apagado{opacity:.34;transition:opacity .35s,border-color .35s}
  .chip.prende{opacity:1;border-color:var(--bronce)}
  .consola{border:1px solid var(--linea);border-radius:12px;background:#0E1621;color:#EDEBE4;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;min-height:150px}
  .consola .tu{color:#C9A24A}
  .consola .ok{color:#8FD3A8}
  .cursor{display:inline-block;width:2px;height:1.05em;background:var(--bronce);vertical-align:-2px;margin-left:2px;animation:parp 900ms steps(1) infinite}
  @keyframes parp{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div id="barra"><div id="progreso"></div></div>
<div class="pista" id="pista">← → para navegar · F pantalla completa</div>
<div id="deck"></div>
<div id="puntos"></div>
<div id="controles">
  <span id="cuenta">1 / 1</span>
  <button id="antes" title="Anterior (←)">←</button>
  <button id="sigue" title="Siguiente (→)">→</button>
</div>

<script>

   Navegación: ← → espacio · F pantalla completa · clic en los puntos.
   ══════════════════════════════════════════════════════════════════════════════════════════ */

const L = [];
function lamina(html, escena){ L.push({html, escena}); }

/* ── 1 · Portada ─────────────────────────────────────────────────────────────────────────── */
lamina(`
<div class="a" style="position:absolute;inset:0"><canvas class="red" id="redPortada"></canvas></div>

  <p class="a serif" style="font-size:15px;color:#B9A16B">№ 01</p>

/* ── 2 · Por qué nació ───────────────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">La idea</div><h2 class="a">Por qué nació</h2></div>

  <div class="grid3">
    <div class="tarjeta a acento"><b>La IA no conoce el derecho chileno</b>

  <p class="a serif" style="font-size:clamp(19px,2.15vw,29px);color:var(--tinta);margin-top:auto;max-width:920px">

/* ── 3 · Para qué es ─────────────────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">La idea</div><h2 class="a">Para qué es</h2>
<p class="a" style="margin-top:8px">Un mismo sistema con dos caminos: el abogado dispone de <b style="color:var(--tinta)">74
herramientas, 19 agentes y 18 skills</b> — y el estudiante, del mismo corpus que se usa en tribunales.</p></div>

  <div class="grid2" style="flex:1;min-height:0">
    <div class="tarjeta a"><h3>Para el ejercicio profesional</h3>
      <ul class="lista">
        <li class="chk">Informes en derecho y análisis <b>con citas a pie de página, en Word editable</b>.</li>
        <li class="chk">Escritos y dossieres para tribunales, con presuma, carátulas y anexos.</li>
        <li class="chk">Consulta a fuentes oficiales: BCN, Contraloría, DT, SII, CMF, SMA, PJUD.</li>
        <li class="chk">Cumplimiento: privacidad y ARCO, probidad, marcas, plazos fatales.</li>
      </ul></div>
    <div class="tarjeta a"><h3>Para el estudio y la docencia</h3>
      <ul class="lista">
        <li class="chk">El corpus completo: apuntes, manuales y <b>21 guías de la Academia Judicial</b>.</li>
        <li class="chk">Examen de grado: interrogación socrática, cédulas y flashcards.</li>
        <li class="chk">Clínica jurídica: fichas sociales y lenguaje claro para usuarios reales.</li>
        <li class="chk">Dataset público en Hugging Face para investigar con IA.</li>
      </ul></div>
  </div>
  <p class="a gris" style="font-size:12.8px">Soberanía, en ambos caminos: 100 % local si se quiere (Ollama) — las causas no
  salen del computador, cero API keys, cero fuga de datos (secreto profesional, art. 247 CP).</p>
</div>`, "paraQue");

/* ── 4 · El puente ───────────────────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">La idea</div><h2 class="a">El puente</h2></div>
<div class="cuerpo" style="justify-content:center">
  <div class="grid3 a" style="align-items:center;grid-template-columns:1fr 1.15fr 1fr">

/* ── 5 · LLM ─────────────────────────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">¿Qué es una IA? ¿Y un «LLM»?</h2></div>
<div class="cuerpo" style="display:grid;grid-template-columns:1.05fr 1.2fr;gap:24px">
  <ul class="lista a" style="align-self:start">
    <li>Es una máquina que <b>apuesta a la palabra siguiente</b>: así se entrenó, leyendo millones de textos.</li>
    <li><b>No consulta una base de datos</b> ni «sabe» derecho: calcula probabilidades.</li>
    <li>Fortaleza: redacta, resume, traduce. <b>Debilidad: inventa con seguridad.</b></li>
    <li>El límite real es el <b>contexto</b>: lee por tokens (≈ 4 caracteres cada uno) y todo lo que lee se paga.</li>
  </ul>
  <div class="tarjeta a" style="display:flex;flex-direction:column;gap:10px">
    <div id="llmFrase" style="font-size:clamp(15px,1.6vw,20px);line-height:1.6;min-height:3.9em"></div>
    <div id="llmPanel" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    <p class="gris" style="font-size:12px">Ilustración: elige «Corte» porque lo leyó miles de veces — y puede
    equivocarse con la misma seguridad.</p>
  </div>
</div>`, "llm");

/* ── 6 · Riesgo, respuesta y regla ───────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">El riesgo, la respuesta y la regla</h2></div>
<div class="cuerpo" style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px">
  <div class="a" style="align-self:center">
    <div class="tarjeta" style="font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7">
      <div id="riesgoLinea1">Según el <i>art. 1546</i> del Código Civil…</div>
      <div id="riesgoLinea2" style="margin-top:8px;transition:opacity .5s;opacity:0">[CS - Rol N° <span id="riesgoRol">99.999-2099</span>] fallo que fija el criterio…</div>
      <div id="riesgoTachado" style="margin-top:8px;opacity:0;transition:opacity .4s;color:var(--rojo)">✗ cita inventada: ese Rol no existe</div>
      <div id="riesgoBueno" style="margin-top:8px;opacity:0;transition:opacity .5s;color:var(--verde)">✓ [BCN - Código Civil, Art. 1546] bcn.cl/leychile — verificado en la fuente</div>
    </div>
    <p class="gris" style="font-size:12px;margin-top:10px">Formato oficial de citación: <span style="font-family:monospace">[BCN - Código Civil, Art. 1545]</span> ·
    <span style="font-family:monospace">[Dictamen DT N° 1234/15 de 2024]</span> · <span style="font-family:monospace">[CS - Rol N° 12.345-2023]</span>.</p>
  </div>
  <div class="a" style="align-self:center">
    <ul class="lista">
      <li><b>El riesgo:</b> un modelo solo puede inventar un fallo que no existe — y decirlo con la seguridad con que acierta.</li>
      <li><b>La respuesta:</b> no se le pide memoria; se le conectan fuentes reales y se le exige citar.</li>
      <li><b>La regla:</b> documentos, citas a pie de página; conversación, citas al final; sin fuente verificable, se dice.</li>
      <li><b>La salvaguarda:</b> crítica forense en 5 dimensiones y compuerta de revisión humana antes de presentar.</li>
    </ul>
  </div>
</div>`, "riesgo");

/* ── 7 · Agente ──────────────────────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">¿Qué es un agente (o «harness»)?</h2></div>

/* ── 8 · MCP ─────────────────────────────────────────────────────────────────────────────── */
lamina(`

lamina(`

/* ── 10 · Capas ──────────────────────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">Todo junto, por capas</h2></div>

const deck = document.getElementById("deck");
const puntos = document.getElementById("puntos");
const progreso = document.getElementById("progreso");
const cuenta = document.getElementById("cuenta");
const OSCURAS = new Set(["red2", "red3", "red4"]);
L.forEach((l, i) => {
  const s = document.createElement("section");
  s.className = "slide" + (i === 0 || OSCURAS.has(l.escena) ? " oscura" : "");
  s.innerHTML = l.html;

  s.dataset.i = i;
  deck.appendChild(s);
  const p = document.createElement("i");
  p.addEventListener("click", () => ir(i));
  puntos.appendChild(p);
});
const slides = [...deck.querySelectorAll(".slide")];
let actual = -1;
let timers = [], rafRed = 0;
function T(fn, ms){ timers.push(setTimeout(fn, ms)); }

function limpiarEscenas(){
  timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  timers = [];
  cancelAnimationFrame(rafRed);
  rafRed = 0;
}

function animar(s){
  limpiarEscenas();
  const as = [...s.querySelectorAll(".a")];
  as.forEach(el => { el.classList.remove("on"); });
  void s.offsetWidth;
  requestAnimationFrame(() => as.forEach((el, k) => {
    el.style.transitionDelay = (k * 0.08) + "s";
    el.classList.add("on");
    if (el.classList.contains("regla")) el.style.transitionDelay = "0.35s";
  }));
  s.querySelectorAll("[data-contador]").forEach(el => {
    const fin = parseFloat(el.dataset.contador);
    const dec = parseInt(el.dataset.decimales || "0", 10);
    const suf = el.dataset.sufijo || "";
    const t0 = performance.now(), dur = 1600;
    const paso = (ahora) => {
      const t = Math.min(1, (ahora - t0) / dur);
      const v = fin * (1 - Math.pow(1 - t, 3));
      el.textContent = v.toLocaleString("es-CL", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + suf;
      if (t < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  });
  s.querySelectorAll("[data-barra]").forEach((el, k) => {
    T(() => { el.style.width = el.dataset.barra + "%"; }, 350 + k * 240);
  });
  const esc = s.dataset.escena;
  if (esc === "llm") escenaLLM(s);
  if (esc === "grafo") escenaGrafo(s);
  if (esc === "mcp") escenaMCP(s);
  if (esc === "flujo") escenaFlujo(s);
  if (esc === "caso") escenaCaso(s);
  if (esc === "citas") escenaCitas(s);
  if (esc === "ahorro") escenaAhorro(s);
  if (esc === "porque") escenaPorQue(s);
  if (esc === "paraQue") escenaParaQue(s);
  if (esc === "puente") escenaPuente(s);
  if (esc === "riesgo") escenaRiesgo(s);
  if (esc === "agente") escenaAgente(s);
  if (esc === "skill") escenaSkill(s);
  if (esc === "miniGrafo") escenaMiniGrafo(s);
  if (esc === "conectores") escenaConectores(s);
  if (esc === "herramientas") escenaHerramientas(s);
  if (esc === "agentes") escenaAgentes(s);
  if (esc === "mesa") escenaMesa(s);
  if (esc === "documentos") escenaDocumentos(s);
  if (esc === "doctrina") escenaDoctrina(s);
  if (esc === "grafoHerramientas") escenaGrafoHerramientas(s);
  if (esc === "estudio") escenaEstudio(s);
  if (esc === "cumplimiento") escenaCumplimiento(s);
  if (esc === "red" || esc === "red2" || esc === "red3" || esc === "red4") redDeNodos(s);
}

function ir(i){
  if (i < 0 || i >= slides.length || i === actual) return;
  if (actual >= 0) slides[actual].classList.remove("activa");
  actual = i;
  const s = slides[i];
  s.classList.add("activa");
  animar(s);
  [...puntos.children].forEach((p, k) => p.classList.toggle("hoy", k === i));
  cuenta.textContent = (i + 1) + " / " + slides.length;
  progreso.style.width = ((i + 1) / slides.length * 100) + "%";
  history.replaceState(null, "", "#" + (i + 1));
}

/* ── helpers ─────────────────────────────────────────────────────────────────────────────── */
function escribirEn(el, texto, ms){
  el.textContent = "";
  let i = 0;
  const iv = setInterval(() => {
    el.textContent = texto.slice(0, ++i);
    if (i >= texto.length) clearInterval(iv);
  }, ms);
  timers.push(iv);
  return iv;
}

/* ── escenas ─────────────────────────────────────────────────────────────────────────────── */
function escenaLLM(s){
  const frase = s.querySelector("#llmFrase"), panel = s.querySelector("#llmPanel");
  if (!frase) return;
  const INICIO = ["El", "recurso", "de", "protección", "se", "interpone", "ante", "la"];
  const PASOS = [
    {e: "Corte", c: [["Corte", 63], ["Excelentísima", 14], ["Sala", 9], ["Justicia", 7]]},
    {e: "de", c: [["de", 81], ["Suprema", 9]]},
    {e: "Apelaciones", c: [["Apelaciones", 77], ["Justicia", 11]]},
    {e: "respectiva", c: [["respectiva", 46], ["que", 18]]},
    {e: ".", c: [[".", 93], [",", 5]]},
  ];
  let palabras = [...INICIO], i = 0;
  const pintar = (res) => {
    frase.innerHTML = palabras.map((p, k) =>
      (k === palabras.length - 1 && res) ? `<span class="nueva" style="color:var(--azul);font-weight:650">${p}</span>` : p).join(" ") +
      `<span class="cursor"></span>`;
  };
  const paso = () => {
    if (i >= PASOS.length) return;
    const p = PASOS[i];
    panel.innerHTML = p.c.map(([w, v]) => `<div class="cand" style="border:1px solid var(--linea);border-radius:9px;padding:7px 9px;opacity:.35;transition:opacity .3s,border-color .3s">
      <div style="font-size:12.4px;font-weight:650">${w === "." ? "fin de la frase" : "«" + w + "»"}</div>
      <div style="font-size:10.4px;color:var(--gris);margin-top:2px">${v} %</div>
      <div data-b="${v}" style="height:6px;border-radius:4px;background:var(--azul);opacity:.35;margin-top:6px;width:0;transition:width .5s"></div></div>`).join("");
    T(() => {
      panel.querySelectorAll(".cand").forEach((el, k) => {
        const ok = p.c[k][0] === p.e;
        el.style.opacity = ok ? 1 : .35;
        el.style.borderColor = ok ? "var(--azul)" : "var(--linea)";
        const b = el.querySelector("[data-b]");
        b.style.width = p.c[k][1] + "%";
        b.style.opacity = ok ? 1 : .35;
      });
      palabras.push(p.e);
      pintar(true);
      i++;
      T(paso, 1100);
    }, 540);
  };
  pintar(false);
  T(paso, 450);
}

function escenaGrafo(s){
  const cv = s.querySelector("#cvGrafo");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = 900, H = 620;
  const pasos = [...s.querySelectorAll("#gPasos li")];
  const nodos = [], aristas = [];
  const rnd = (sem) => { let x = sem % 2147483647; return () => (x = x * 16807 % 2147483647) / 2147483647; };
  const r = rnd(7);
  for (let i = 0; i < 84; i++) nodos.push({x: 60 + r() * 780, y: 50 + r() * 520, tipo: i % 9 === 0 ? "n" : (i % 13 === 0 ? "f" : "i")});
  for (let i = 0; i < 70; i++){
    const a = nodos[(i * 7) % 84], b = nodos[(i * 13 + 5) % 84];
    if (a !== b) aristas.push({a, b});
  }
  const COL = {i: "#2E5D8A", n: "#1E7A5A", f: "#8F2F2F"};
  const comunidad = (y) => [0.15, 0.38, 0.62, 0.85][Math.floor(y / 155) % 4];
  const dibujar = (fase, prog) => {
    ctx.clearRect(0, 0, W, H);
    if (fase >= 0) nodos.slice(0, Math.round(nodos.length * (fase === 0 ? prog : 1))).forEach(n => {
      ctx.beginPath();
      ctx.fillStyle = fase >= 4 ? ["#2E5D8A", "#1E7A5A", "#8F2F2F", "#A67C2E"][Math.floor(comunidad(n.y) * 4)] : COL[n.tipo];
      ctx.globalAlpha = fase >= 2 ? .85 : .35;
      ctx.arc(n.x, n.y, 4.6, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
    if (fase >= 3) aristas.slice(0, Math.round(aristas.length * (fase === 3 ? prog : 1))).forEach(a => {
      ctx.beginPath();
      ctx.strokeStyle = "rgba(90,112,134,.5)";
      ctx.moveTo(a.a.x, a.a.y);
      ctx.lineTo(a.a.x + (a.b.x - a.a.x) * (fase === 3 ? prog : 1), a.a.y + (a.b.y - a.a.y) * (fase === 3 ? prog : 1));
      ctx.stroke();
    });
    if (fase >= 5) for (let k = 0; k < 5; k++){
      const nx = 120 + k * 165, ny = 90 + (k % 2) * 380;
      ctx.beginPath(); ctx.fillStyle = "#A67C2E"; ctx.arc(nx, ny, 7, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.strokeStyle = "rgba(166,124,46,.7)";
      ctx.moveTo(nx, ny); ctx.lineTo(nodos[k * 9].x, nodos[k * 9].y); ctx.stroke();
    }
  };
  let fase = -1;
  const avanzar = () => {
    fase++;
    if (fase >= 6) return;
    pasos.forEach((li, k) => li.classList.toggle("hoy", k <= fase));
    const t0 = performance.now(), dur = 900;
    const paso = (ahora) => {
      const t = Math.min(1, (ahora - t0) / dur);
      dibujar(fase, t);
      if (t < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);

function escenaMiniGrafo(s){
  const cv = s.querySelector("#cvEgo");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = 640, H = 420;
  const rnd = (sem) => { let x = sem % 2147483647; return () => (x = x * 16807 % 2147483647) / 2147483647; };
  let intento = 0, t = 0;
  const dibujar = (t) => {
    ctx.clearRect(0, 0, W, H);
    const r = rnd(11 + intento * 5);
    const cx = W / 2, cy = H / 2 - 10;
    const vecinos = [];
    for (let i = 0; i < 16; i++){
      const ang = (i / 16) * 6.283, d = 110 + r() * 60;
      vecinos.push({x: cx + Math.cos(ang) * d, y: cy + Math.sin(ang) * d * .78, tono: i % 4});
    }
    vecinos.forEach((v, i) => {
      const prog = Math.max(0, Math.min(1, (t - i * 4) / 22));
      ctx.beginPath();
      ctx.strokeStyle = `rgba(90,112,134,${0.5 * prog})`;
      ctx.moveTo(cx, cy); ctx.lineTo(cx + (v.x - cx) * prog, cy + (v.y - cy) * prog);
      ctx.stroke();
    });
    const pp = Math.max(0, Math.min(1, t / 20));
    ctx.beginPath(); ctx.fillStyle = "#A67C2E"; ctx.arc(cx, cy, 9 * pp, 0, 6.283); ctx.fill();
    vecinos.forEach((v, i) => {
      const prog = Math.max(0, Math.min(1, (t - 12 - i * 4) / 22));
      if (prog <= 0) return;
      ctx.beginPath();
      ctx.fillStyle = ["#2E5D8A", "#1E7A5A", "#8F2F2F", "#5A7086"][v.tono];
      ctx.globalAlpha = .9 * prog;
      ctx.arc(v.x, v.y, 4.4 * prog + 1, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  };
  const paso = () => {
    t++;
    dibujar(t);
    if (t > 64) { intento++; t = 0; }
    rafRed = requestAnimationFrame(paso);
  };
  paso();
}

function escenaGrafoHerramientas(s){
  const cv = s.querySelector("#cvCamino");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = 700, H = 340;
  const rnd = (sem) => { let x = sem % 2147483647; return () => (x = x * 16807 % 2147483647) / 2147483647; };
  const r = rnd(23);
  const nodos = [];
  for (let i = 0; i < 34; i++) nodos.push({x: 40 + r() * 620, y: 30 + r() * 280, t: i === 0 ? "ini" : (i === 33 ? "fin" : "")});
  const camino = [nodos[0], nodos[7], nodos[18], nodos[26], nodos[33]];
  const dibujar = (prog) => {
    ctx.clearRect(0, 0, W, H);
    nodos.forEach(n => {
      ctx.beginPath();
      ctx.fillStyle = n.t ? "#A67C2E" : "rgba(90,112,134,.45)";
      ctx.arc(n.x, n.y, n.t ? 6 : 3.2, 0, 6.283);
      ctx.fill();
    });
    ctx.beginPath();
    ctx.strokeStyle = "#A67C2E";
    ctx.lineWidth = 2.2;
    const total = camino.length - 1;
    const avance = prog * total;
    ctx.moveTo(camino[0].x, camino[0].y);
    for (let i = 1; i <= total; i++){
      const seg = Math.min(1, Math.max(0, avance - (i - 1)));
      const x = camino[i - 1].x + (camino[i].x - camino[i - 1].x) * seg;
      const y = camino[i - 1].y + (camino[i].y - camino[i - 1].y) * seg;
      ctx.lineTo(x, y);
      if (seg < 1) break;
    }
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = "#3B4754";
    ctx.font = "600 13px -apple-system, Segoe UI, Roboto, sans-serif";
    ctx.fillText("despido injustificado", Math.max(8, nodos[0].x - 10), Math.max(18, nodos[0].y - 14));
    ctx.fillText("tutela de derechos fundamentales", Math.max(8, nodos[33].x - 190), Math.min(H - 8, nodos[33].y + 26));
  };
  let t = 0;
  const paso = () => {
    t++;
    dibujar(Math.min(1, t / 90));
    if (t > 150) t = 0;
    rafRed = requestAnimationFrame(paso);
  };
  paso();
}

/* red de nodos (portada, secciones, cierre) */
function redDeNodos(s){
  const cv = s.querySelector("canvas.red");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = cv.clientHeight * devicePixelRatio;
  const rnd = (sem) => { let x = sem % 2147483647; return () => (x = x * 16807 % 2147483647) / 2147483647; };
  const r = rnd(31);
  const nodos = [];
  for (let i = 0; i < 56; i++) nodos.push({x: r(), y: r(), vx: (r() - .5) * .00022, vy: (r() - .5) * .00022, c: r() < .28 ? "166,124,46" : "159,178,192"});
  let t = 0;
  const paso = () => {
    t++;
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    nodos.forEach(n => { n.x += n.vx; n.y += n.vy;
      if (n.x < .02 || n.x > .98) n.vx *= -1;
      if (n.y < .03 || n.y > .97) n.vy *= -1; });
    for (let i = 0; i < nodos.length; i++)
      for (let j = i + 1; j < nodos.length; j++){
        const dx = (nodos[i].x - nodos[j].x) * W, dy = (nodos[i].y - nodos[j].y) * H;
        const d = Math.hypot(dx, dy);
        if (d < 190){
          ctx.beginPath();
          ctx.strokeStyle = `rgba(159,178,192,${(1 - d / 190) * .16})`;
          ctx.lineWidth = 1;
          ctx.moveTo(nodos[i].x * W, nodos[i].y * H);
          ctx.lineTo(nodos[j].x * W, nodos[j].y * H);
          ctx.stroke();
        }
      }
    nodos.forEach((n, k) => {
      const pulso = .55 + .45 * Math.sin(t * .012 + k);
      ctx.beginPath();
      ctx.fillStyle = `rgba(${n.c},${.25 + .35 * pulso})`;
      ctx.arc(n.x * W, n.y * H, 2.1 * devicePixelRatio, 0, 6.283);
      ctx.fill();
    });
    rafRed = requestAnimationFrame(paso);
  };
  paso();
}
