<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Legal Chile — presentación</title>
<style>
  :root{
    --tinta:#0E1621; --papel:#FBFAF7; --bronce:#A67C2E; --bronce2:#C9A24A;
    --gris:#5C6673; --linea:#E4DFD4; --azul:#2E5D8A; --verde:#1E7A5A; --rojo:#8F2F2F;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);overflow:hidden}

  /* barra de progreso y controles */
  #barra{position:fixed;top:0;left:0;right:0;height:2px;background:rgba(14,22,33,.08);z-index:50}
  #progreso{height:100%;width:0;background:var(--bronce);transition:width .5s cubic-bezier(.2,.7,.2,1)}
  #controles{position:fixed;bottom:14px;right:18px;display:flex;align-items:center;gap:10px;z-index:50;
    font-size:12px;color:var(--gris)}
  #controles button{border:1px solid var(--linea);background:transparent;color:inherit;border-radius:9px;
    padding:5px 11px;font:inherit;cursor:pointer;transition:border-color .25s}
  #controles button:hover{border-color:var(--bronce)}
  #puntos{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:50}
  #puntos i{width:6px;height:6px;border-radius:50%;background:var(--linea);cursor:pointer;transition:background .3s, transform .3s}
  #puntos i.hoy{background:var(--bronce);transform:scale(1.35)}
  .pista{position:fixed;top:16px;right:18px;z-index:60;font-size:11.5px;color:var(--gris);
    border:1px solid var(--linea);border-radius:20px;padding:6px 13px;background:var(--papel);
    opacity:0;transition:opacity .8s}
  .pista.ver{opacity:1}

  /* láminas */
  .slide{position:fixed;inset:0;display:none;flex-direction:column;
    padding:clamp(30px,5.4vh,62px) clamp(30px,6.5vw,104px) clamp(52px,7vh,74px)}
  .slide.activa{display:flex}
  .slide.oscura{background:var(--tinta);color:#EFEBE2}
  .slide.oscura .gris{color:#9AA7B4}

  .ceja{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronce);
    display:flex;align-items:center;gap:14px;margin-bottom:1.6vh}
  .ceja::before{content:"";width:30px;height:1px;background:var(--bronce);display:block}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,6.4vw,84px);line-height:1.02;
    letter-spacing:-.015em;margin:0}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.6vw,50px);line-height:1.08;
    letter-spacing:-.01em;margin:0}
  h3{font-size:15px;margin:0 0 6px;font-weight:700}
  p{font-size:clamp(13.5px,1.35vw,17px);line-height:1.6;color:var(--gris);margin:0}
  .gris{color:var(--gris)}
  .cuerpo{margin-top:2.6vh;flex:1;display:flex;flex-direction:column;gap:2.2vh;min-height:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tarjeta{border:1px solid var(--linea);border-radius:14px;padding:18px 20px;background:#fff}
  .oscura .tarjeta{background:rgba(255,255,255,.04);border-color:rgba(239,235,226,.18)}
  .tarjeta b{font-size:14.5px}
  .tarjeta p{margin-top:6px;font-size:13px}
  .acento{border-left:3px solid var(--bronce)}
  .num{font-family:var(--serif);font-size:clamp(30px,3.6vw,52px);line-height:1;font-variant-numeric:tabular-nums}
  .num small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--gris);
    margin-top:8px;line-height:1.45;font-weight:400}
  .serif{font-family:var(--serif)}
  ul.lista{margin:0;padding:0;list-style:none}
  ul.lista li{padding:7px 0 7px 18px;position:relative;font-size:clamp(13px,1.25vw,16px);color:var(--gris);border-bottom:1px solid rgba(228,223,212,.55)}
  ul.lista li:last-child{border-bottom:0}
  ul.lista li::before{content:"";position:absolute;left:0;top:15px;width:7px;height:1px;background:var(--bronce)}
  ul.lista li b{color:var(--tinta)}

  /* animaciones de entrada */
  .a{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
  .a.on{opacity:1;transform:none}
  .regla{height:1px;background:var(--bronce);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .regla.on{width:86px}

  /* barras */
  .fila{display:flex;align-items:center;gap:12px;margin:10px 0}
  .fila .etq{width:150px;font-size:13px;color:var(--gris)}
  .pista-bar{flex:1;height:10px;background:rgba(14,22,33,.06);border-radius:6px;overflow:hidden}
  .barra-i{height:100%;width:0;border-radius:6px;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
  .barra-i.b1{background:#C9D4E0}.barra-i.b2{background:var(--azul)}
  .fila .val{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--tinta)}

  /* canvas */
  canvas.red{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .encima{position:relative;z-index:1}

  /* secuencias */
  .paso{opacity:.22;transition:opacity .5s, transform .5s;transform:translateY(4px)}
  .paso.hoy{opacity:1;transform:none}
  .flecha{color:var(--linea);font-size:20px;transition:color .5s}
  .flecha.hoy{color:var(--bronce)}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div id="barra"><div id="progreso"></div></div>
<div class="pista" id="pista">← → para navegar · F pantalla completa</div>
<div id="deck"></div>
<div id="puntos"></div>
<div id="controles">
  <span id="cuenta">1 / 1</span>
  <button id="antes" title="Anterior (←)">←</button>
  <button id="sigue" title="Siguiente (→)">→</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Open Legal Chile — presentación en HTML, minimalista y animada.
   Un solo archivo. Navegación: ← → espacio · F pantalla completa · clic en los puntos.
   Cada lámina es una escena animada: se re-ejecuta al entrar.
   ══════════════════════════════════════════════════════════════════════════ */

const L = [];  // láminas: {html, escena?, corrida?}
function lamina(html, escena){ L.push({html, escena}); }

/* ── 1 · Portada ─────────────────────────────────────────────────────────── */
lamina(`
<div class="a" style="position:absolute;inset:0"><canvas class="red" id="redPortada"></canvas></div>
<div class="encima a" style="margin-top:auto">
  <div class="ceja">Prueba en vivo · Facultad de Derecho</div>
  <h1 class="a">Open Legal Chile</h1>
  <div class="regla a" style="margin:26px 0 22px"></div>
  <p class="a" style="max-width:760px;font-size:clamp(15px,1.6vw,20px)">
    Cómo funciona, de lo más básico a lo más complejo — y por qué existe:
    <b style="color:var(--tinta)">acercar la IA al derecho chileno</b>, con enfoque profesional y ético.</p>
</div>
<div class="encima a" style="margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end">
  <div><p class="a" style="color:#B9A16B">Pablo Benavides Jorquera · Septiembre 2026</p>
  <p class="a" style="font-size:12.5px;margin-top:4px">Sistema que cita: cada dato muestra de dónde viene.</p></div>
  <p class="a serif" style="font-size:15px;color:#B9A16B">№ 01</p>
</div>`, "red");

/* ── 2 · Por qué nació ───────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">La idea</div><h2 class="a">Por qué nació</h2></div>
<div class="cuerpo">
  <div class="grid3">
    <div class="tarjeta a acento"><b>La IA no conoce el derecho chileno</b>
      <p>Los modelos generalistas se entrenaron con otros países: citan mal, ignoran nuestra normativa y nuestros tribunales.</p></div>
    <div class="tarjeta a acento"><b>Inventa con seguridad</b>
      <p>Una cita de un fallo que no existe, un plazo que suena razonable. En derecho eso no es un detalle: es un riesgo.</p></div>
    <div class="tarjeta a acento"><b>Las fuentes están dispersas</b>
      <p>BCN, Contraloría, Dirección del Trabajo, doctrina, guías: cada consulta cuesta tiempo y conocimiento experto.</p></div>
  </div>
  <p class="a serif" style="font-size:clamp(20px,2.3vw,31px);color:var(--tinta);margin-top:auto;max-width:900px">
    La pregunta que lo originó: <i>¿y si la IA trabajara con las fuentes reales del derecho chileno —
    y lo mostrara?</i></p>
</div>`);

/* ── 3 · Para qué es ─────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">La idea</div><h2 class="a">Para qué es</h2>
<p class="a" style="margin-top:10px">Un mismo sistema con dos caminos: porque el derecho se aprende y se ejerce con las mismas fuentes.</p></div>
<div class="cuerpo">
  <div class="grid2" style="flex:1;min-height:0">
    <div class="tarjeta a"><h3>Para el ejercicio profesional</h3>
      <ul class="lista">
        <li>Informes en derecho y análisis <b>con citas a pie de página, en Word editable</b>.</li>
        <li>Escritos y dossieres para tribunales, con carátulas y anexos.</li>
        <li>Consulta a fuentes oficiales: BCN, Contraloría, DT, SII, CMF, SMA.</li>
        <li>Privacidad y cumplimiento: tramitación ARCO, probidad, regulatorio.</li>
      </ul></div>
    <div class="tarjeta a"><h3>Para el estudio y la docencia</h3>
      <ul class="lista">
        <li>El corpus doctrinal completo: apuntes, materiales y <b>guías de la Academia Judicial</b>.</li>
        <li>El grafo para estudiar e investigar: instituciones, normas y fallos conectados.</li>
        <li>Preparación de exámenes de grado y clínica jurídica.</li>
        <li>Dataset público en Hugging Face: investigación con IA sobre derecho chileno.</li>
      </ul></div>
  </div>
  <p class="a gris" style="font-size:13.5px">Enfoque profesional y ético en ambos caminos: citar siempre, no inventar
  jamás, y dejar fuera los datos de las personas.</p>
</div>`);

/* ── 4 · El puente ───────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">La idea</div><h2 class="a">El puente</h2></div>
<div class="cuerpo" style="justify-content:center">
  <div class="grid3 a" style="align-items:center;grid-template-columns:1fr 1.15fr 1fr">
    <div class="tarjeta" style="text-align:center;background:var(--tinta);color:#EFEBE2;border:0">
      <b style="font-size:17px">IA</b><p style="color:#9AA7B4;margin-top:4px">que redacta y razona</p></div>
    <div style="text-align:center">
      <p class="serif" style="font-size:clamp(16px,1.9vw,24px);color:var(--tinta)">Open Legal Chile</p>
      <p style="font-size:12.5px;margin-top:6px">fuentes oficiales · corpus doctrinal · citas trazables · reglas de la casa</p></div>
    <div class="tarjeta" style="text-align:center;background:var(--verde);color:#fff;border:0">
      <b style="font-size:17px">Derecho chileno</b><p style="color:#CFE6DC;margin-top:4px">con sus fuentes y su ética</p></div>
  </div>
  <div class="grid4 a" style="margin-top:2vh">
    <div class="tarjeta"><b>Conectores del Estado</b><p>BCN, CGR, DT, SII, CMF, SMA, PJUD…</p></div>
    <div class="tarjeta"><b>Corpus completo</b><p>248 documentos chilenos en Markdown</p></div>
    <div class="tarjeta"><b>Citas trazables</b><p>cada dato hasta su origen</p></div>
    <div class="tarjeta"><b>Reglas de la casa</b><p>citar siempre; no inventar jamás</p></div>
  </div>
  <p class="a serif" style="font-size:clamp(17px,1.9vw,25px);color:var(--tinta);text-align:center;margin-top:1.6vh">
    La IA no reemplaza al abogado: lo <i>acerca</i> a sus fuentes.</p>
</div>`);

/* ── 5 · LLM (escena animada) ────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">¿Qué es una IA? ¿Y un «LLM»?</h2></div>
<div class="cuerpo" style="display:grid;grid-template-columns:1.05fr 1.2fr;gap:26px">
  <ul class="lista a" style="align-self:start">
    <li>Es una máquina que <b>apuesta a la palabra siguiente</b>: así se entrenó, leyendo millones de textos.</li>
    <li><b>No consulta una base de datos</b> ni «sabe» derecho: calcula probabilidades.</li>
    <li>Fortaleza: redacta, resume, traduce. <b>Debilidad: inventa con seguridad.</b></li>
  </ul>
  <div class="tarjeta a" style="display:flex;flex-direction:column;gap:12px">
    <style>
      #llmFrase{font-size:clamp(15px,1.7vw,21px);line-height:1.6;min-height:4.6em}
      #llmFrase .nueva{color:var(--azul);font-weight:650}
      #llmFrase .cursor{display:inline-block;width:2px;height:1.05em;background:var(--bronce);vertical-align:-2px;margin-left:2px;animation:parp 900ms steps(1) infinite}
      @keyframes parp{50%{opacity:0}}
      #llmPanel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
      .cand{border:1px solid var(--linea);border-radius:9px;padding:7px 9px;opacity:.35;transition:opacity .3s,border-color .3s}
      .cand.on{opacity:1;border-color:var(--azul)}
      .cand .w{font-size:12.5px;font-weight:650}
      .cand .pct{font-size:10.5px;color:var(--gris);margin-top:2px}
      .cand .b{height:6px;border-radius:4px;background:var(--azul);opacity:.35;margin-top:6px;width:0;transition:width .5s}
      .cand.on .b{opacity:1}
    </style>
    <div id="llmFrase"></div>
    <div id="llmPanel"></div>
    <p class="gris" style="font-size:12px">Ilustración: el modelo elige «Corte» porque lo leyó miles de veces — y puede
    equivocarse con la misma seguridad.</p>
  </div>
</div>`, "llm");

/* ── 6 · Riesgo y respuesta ──────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">El riesgo, la respuesta y la regla</h2></div>
<div class="cuerpo">
  <div class="grid3">
    <div class="tarjeta a acento"><b>El riesgo</b>
      <p>Un modelo solo puede inventar un fallo que no existe, un artículo que no dice eso, un plazo que suena razonable — y decirlo con la misma seguridad con que acierta.</p></div>
    <div class="tarjeta a acento" style="border-left-color:var(--verde)"><b>La respuesta</b>
      <p>No se le pide memoria: se le conectan fuentes reales (conectores del Estado, doctrina, corpus) y se le exige citar.</p></div>
    <div class="tarjeta a acento"><b>La regla</b>
      <p>En los documentos, citas a pie de página. En la conversación, al final. Sin fuente verificable: se dice, no se rellena.</p></div>
  </div>
  <p class="a serif" style="font-size:clamp(17px,1.9vw,25px);color:var(--tinta);margin-top:auto">
    Sin citas, un modelo es un pasante del que no sabés si estudió o improvisó.</p>
</div>`);

/* ── 7 · Agente ──────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">¿Qué es un agente (o «harness»)?</h2></div>
<div class="cuerpo">
  <div class="grid3">
    <div class="tarjeta a"><b>El motor</b><p>El LLM solo: puede conversar, pero no busca, no lee tus archivos y olvida todo al cerrar.</p></div>
    <div class="tarjeta a acento" style="border-left-color:var(--verde)"><b>El auto completo</b>
      <p>El agente le da herramientas, procedimientos, memoria, permisos y reglas. Decide cuándo usar cada cosa y deja rastro.</p></div>
    <div class="tarjeta a acento"><b>Ejemplos</b><p>Claude Code · Antigravity · Hermes (el de esta casa). Todos hablan el mismo idioma de herramientas.</p></div>
  </div>
  <p class="a gris">En la prueba en vivo: <b style="color:var(--tinta)">«analizá esta carpeta»</b> — el agente llama solo a las herramientas, sin comandos.</p>
</div>`);

/* ── 8 · MCP ─────────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">MCP: el enchufe de las herramientas</h2></div>
<div class="cuerpo" style="display:grid;grid-template-columns:1.1fr 1fr;gap:30px">
  <ul class="lista a" style="align-self:start">
    <li>Un <b>protocolo estándar</b>: como el USB-C, deja que cualquier agente use las mismas herramientas.</li>

  </ul>
  <div class="a" style="align-self:center" id="mcpEscena">
    <div style="display:flex;align-items:flex-start;gap:0">
      <div class="tarjeta" style="width:170px;text-align:center;background:var(--tinta);color:#fff;border:0;padding:14px 10px"><b>Agente</b></div>
      <svg id="mcpLineas" width="70" height="260" style="overflow:visible"></svg>
      <div id="mcpChips" style="display:grid;gap:9px"></div>
    </div>
  </div>
</div>`, "mcp");

/* ── 9 · Skill ───────────────────────────────────────────────────────────── */
lamina(`
<div class="a"><div class="ceja">Los cimientos</div><h2 class="a">¿Qué es una skill? El manual de procedimiento</h2></div>
<div class="cuerpo" style="display:grid;grid-template-columns:1fr 1.15fr;gap:26px">
  <ul class="lista a" style="align-self:start">
    <li>Un <b>procedimiento escrito</b> que el agente lee antes de actuar: como un protocolo del estudio.</li>

      <li>5 · Redactar el informe en Word, con citas a pie de página.</li>

</div>`);

/* ── 10 · Capas ──────────────────────────────────────────────────────────── */
lamina(`

/* ── 11 · Separador Parte 2 ──────────────────────────────────────────────── */
lamina(`
<div class="a" style="position:absolute;inset:0"><canvas class="red" id="redSeccion"></canvas></div>
<div class="encima a" style="margin-top:auto">
  <div class="ceja" style="color:var(--bronce2)">Parte 2</div>

/* ══════════════════════════════════════════════════════════════════════════
   Motor: pintado, navegación y animaciones
   ══════════════════════════════════════════════════════════════════════════ */
const deck = document.getElementById("deck");
const puntos = document.getElementById("puntos");
const progreso = document.getElementById("progreso");
const cuenta = document.getElementById("cuenta");
L.forEach((l, i) => {
  const s = document.createElement("section");
  s.className = "slide" + (i === 0 || l.escena === "red2" || l.escena === "red3" ? " oscura" : "");
  s.innerHTML = l.html;
  s.dataset.escena = l.escena || "";
  s.dataset.i = i;
  deck.appendChild(s);
  const p = document.createElement("i");
  p.addEventListener("click", () => ir(i));
  puntos.appendChild(p);
});
const slides = [...deck.querySelectorAll(".slide")];
let actual = -1;
let timers = [], rafRed = 0;
const canvasActivos = [];

function limpiarEscenas(){
  timers.forEach(t => clearTimeout(t));
  timers = [];
  cancelAnimationFrame(rafRed);
  rafRed = 0;
}

function animar(s){
  limpiarEscenas();
  const as = [...s.querySelectorAll(".a")];
  as.forEach(el => { el.classList.remove("on"); });
  void s.offsetWidth;
  requestAnimationFrame(() => as.forEach((el, k) => {
    el.style.transitionDelay = (k * 0.085) + "s";
    el.classList.add("on");
    if (el.classList.contains("regla")) el.style.transitionDelay = "0.35s";
  }));
  // contadores
  s.querySelectorAll("[data-contador]").forEach(el => {
    const fin = parseFloat(el.dataset.contador);
    const dec = parseInt(el.dataset.decimales || "0", 10);
    const suf = el.dataset.sufijo || "";
    const t0 = performance.now(), dur = 1600;
    const paso = (ahora) => {
      const t = Math.min(1, (ahora - t0) / dur);
      const v = fin * (1 - Math.pow(1 - t, 3));
      el.textContent = v.toLocaleString("es-CL", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + suf;
      if (t < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  });
  // barras
  s.querySelectorAll("[data-barra]").forEach((el, k) => {
    timers.push(setTimeout(() => { el.style.width = el.dataset.barra + "%"; }, 350 + k * 260));
  });
  // escenas propias
  const esc = s.dataset.escena;
  if (esc === "llm") escenaLLM(s);
  if (esc === "grafo") escenaGrafo(s);
  if (esc === "mcp") escenaMCP(s);
  if (esc === "flujo") escenaFlujo(s);
  if (esc === "caso") escenaCaso(s);
  if (esc === "citas") escenaCitas(s);
  if (esc === "ahorro") escenaAhorro(s);
  if (esc === "red" || esc === "red2" || esc === "red3") redDeNodos(s);
}

function ir(i){
  if (i < 0 || i >= slides.length || i === actual) return;
  if (actual >= 0) slides[actual].classList.remove("activa");
  actual = i;
  const s = slides[i];
  s.classList.add("activa");

  [...puntos.children].forEach((p, k) => p.classList.toggle("hoy", k === i));
  cuenta.textContent = (i + 1) + " / " + slides.length;
  progreso.style.width = ((i + 1) / slides.length * 100) + "%";
  history.replaceState(null, "", "#" + (i + 1));
}

/* ── escenas particulares ────────────────────────────────────────────────── */
function escenaLLM(s){
  const frase = s.querySelector("#llmFrase"), panel = s.querySelector("#llmPanel");
  if (!frase) return;
  const INICIO = ["El", "recurso", "de", "protección", "se", "interpone", "ante", "la"];
  const PASOS = [
    {e: "Corte", c: [["Corte", 63], ["Excelentísima", 14], ["Sala", 9], ["Justicia", 7]]},
    {e: "de", c: [["de", 81], ["Suprema", 9]]},
    {e: "Apelaciones", c: [["Apelaciones", 77], ["Justicia", 11]]},
    {e: "respectiva", c: [["respectiva", 46], ["que", 18]]},
    {e: ".", c: [["fin de la frase", 93]]},
  ];
  let palabras = [...INICIO], i = 0;
  const pintar = (res) => {
    frase.innerHTML = palabras.map((p, k) =>
      (k === palabras.length - 1 && res) ? `<span class="nueva">${p}</span>` : p).join(" ") +
      `<span class="cursor"></span>`;
  };
  const paso = () => {
    if (i >= PASOS.length) return;
    const p = PASOS[i];
    panel.innerHTML = p.c.map(([w, v]) => `<div class="cand"><div class="w">${w}</div>
      <div class="pct">${v} %</div><div class="b" data-v="${v}"></div></div>`).join("");
    timers.push(setTimeout(() => {
      panel.querySelectorAll(".cand").forEach((el, k) => {
        el.classList.toggle("on", k === 0);
        el.querySelector(".b").style.width = p.c[k][1] + "%";
      });
      palabras.push(p.e);
      pintar(true);
      i++;
      timers.push(setTimeout(paso, 1150));
    }, 560));
  };
  pintar(false);
  timers.push(setTimeout(paso, 500));
}

function escenaGrafo(s){
  const cv = s.querySelector("#cvGrafo");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = 900, H = 620;
  const pasos = [...s.querySelectorAll("#gPasos li")];
  let nodos = [], aristas = [];
  const rnd = (sem) => { let x = sem % 2147483647; return () => (x = x * 16807 % 2147483647) / 2147483647; };
  const r = rnd(7);
  for (let i = 0; i < 84; i++) nodos.push({x: 60 + r() * 780, y: 50 + r() * 520, tipo: i % 9 === 0 ? "n" : (i % 13 === 0 ? "f" : "i"), t: 0});
  for (let i = 0; i < 70; i++){
    const a = nodos[(i * 7) % 84], b = nodos[(i * 13 + 5) % 84];
    if (a !== b) aristas.push({a, b, t: 0});
  }
  const COL = {i: "#2E5D8A", n: "#1E7A5A", f: "#8F2F2F"};
  const comunidad = (y) => [0.15, 0.38, 0.62, 0.85][Math.floor(y / 155) % 4];
  const etapas = [0, 1, 2, 3, 4, 5];
  const dibujar = (fase, prog) => {
    ctx.clearRect(0, 0, W, H);
    if (fase >= 0){
      nodos.slice(0, Math.round(nodos.length * (fase === 0 ? prog : 1))).forEach(n => {
        if (fase === 0 && n.t > prog) return;
        ctx.beginPath();
        ctx.fillStyle = fase >= 4 ? ["#2E5D8A", "#1E7A5A", "#8F2F2F", "#A67C2E"][Math.floor(comunidad(n.y) * 4)] : COL[n.tipo];
        ctx.globalAlpha = fase >= 2 ? .85 : .35;
        ctx.arc(n.x, n.y, 4.6, 0, 6.283);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }
    if (fase >= 3) aristas.slice(0, Math.round(aristas.length * (fase === 3 ? prog : 1))).forEach(a => {
      ctx.beginPath();
      ctx.strokeStyle = "rgba(90,112,134,.5)";
      ctx.moveTo(a.a.x, a.a.y);
      ctx.lineTo(a.a.x + (a.b.x - a.a.x) * (fase === 3 ? prog : 1), a.a.y + (a.b.y - a.a.y) * (fase === 3 ? prog : 1));
      ctx.stroke();
    });
    if (fase >= 5){
      for (let k = 0; k < 5; k++){
        const nx = 120 + k * 165, ny = 90 + (k % 2) * 380;
        ctx.beginPath(); ctx.fillStyle = "#A67C2E"; ctx.arc(nx, ny, 7, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.strokeStyle = "rgba(166,124,46,.7)";
        ctx.moveTo(nx, ny); ctx.lineTo(nodos[k * 9].x, nodos[k * 9].y); ctx.stroke();
      }
    }
  };
  let fase = -1;
  const avanzar = () => {
    fase++;
    if (fase >= 6) return;
    pasos.forEach((li, k) => li.classList.toggle("hoy", k <= fase));
    const t0 = performance.now(), dur = 900;
    const paso = (ahora) => {
      const t = Math.min(1, (ahora - t0) / dur);
      dibujar(fase, t);
      if (t < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
    timers.push(setTimeout(avanzar, fase === 0 ? 1100 : 1250));
  };
  dibujar(-1, 0);
  timers.push(setTimeout(avanzar, 700));
}

function escenaMCP(s){
  const chips = s.querySelector("#mcpChips"), svg = s.querySelector("#mcpLineas");
  if (!chips) return;
  const N = ["BCN", "Contraloría", "DT", "Doctrina y guías", "Grafo"];
  chips.innerHTML = N.map((t, k) => `<div class="tarjeta cc" style="opacity:0;transition:opacity .45s,transform .45s;transform:translateX(-6px);
    padding:8px 13px;border-radius:10px"><b style="font-size:12.5px">${t}</b></div>`).join("");
  svg.innerHTML = "";
  const H = chips.offsetHeight || 260;
  svg.setAttribute("height", String(H));
  N.forEach(() => {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", "0"); l.setAttribute("y1", String(Math.round(H / 2)));
    l.setAttribute("x2", "0"); l.setAttribute("y2", String(Math.round(H / 2)));
    l.setAttribute("stroke", "#E4DFD4"); l.setAttribute("stroke-width", "1.2");
    svg.appendChild(l);
  });
  [...chips.children].forEach((c, k) => {
    timers.push(setTimeout(() => { c.style.opacity = 1; c.style.transform = "none"; }, 500 + k * 230));
    timers.push(setTimeout(() => {
      const l = svg.children[k];
      l.style.transition = "all .45s";
      l.setAttribute("x2", "70");
      l.setAttribute("y2", String(Math.round(c.offsetTop + c.offsetHeight / 2)));
    }, 680 + k * 230));
  });
}

function escenaAhorro(s){
  const a = s.querySelector("#ahorroA"), b = s.querySelector("#ahorroB");
  if (!a) return;
  const animarNum = (el, fin, ms) => {
    const t0 = performance.now();
    const paso = (ahora) => {
      const t = Math.min(1, (ahora - t0) / ms);
      el.textContent = Math.round(fin * (1 - Math.pow(1 - t, 3))).toLocaleString("es-CL");
      if (t < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  };
  timers.push(setTimeout(() => animarNum(a, 113458, 1800), 400));
  timers.push(setTimeout(() => animarNum(b, 123, 1800), 700));
}

/* red de nodos (portada, secciones, cierre): elegante y lenta */
function redDeNodos(s){
  const cv = s.querySelector("canvas.red");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const ajustar = () => { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; };
  ajustar();
  const rnd = (sem) => { let x = sem % 2147483647; return () => (x = x * 16807 % 2147483647) / 2147483647; };
  const r = rnd(31);
  const nodos = [];
  for (let i = 0; i < 56; i++) nodos.push({x: r(), y: r(), vx: (r() - .5) * .00022, vy: (r() - .5) * .00022, c: r() < .28 ? "166,124,46" : "159,178,192"});
  let t = 0;
  const paso = () => {
    t++;
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    nodos.forEach(n => { n.x += n.vx; n.y += n.vy;
      if (n.x < .02 || n.x > .98) n.vx *= -1;
      if (n.y < .03 || n.y > .97) n.vy *= -1; });
    for (let i = 0; i < nodos.length; i++)
      for (let j = i + 1; j < nodos.length; j++){
        const dx = (nodos[i].x - nodos[j].x) * W, dy = (nodos[i].y - nodos[j].y) * H;
        const d = Math.hypot(dx, dy);
        if (d < 190){
          ctx.beginPath();
          ctx.strokeStyle = `rgba(159,178,192,${(1 - d / 190) * .16})`;
          ctx.lineWidth = 1;
          ctx.moveTo(nodos[i].x * W, nodos[i].y * H);
          ctx.lineTo(nodos[j].x * W, nodos[j].y * H);
          ctx.stroke();
        }
      }
    nodos.forEach((n, k) => {
      const pulso = .55 + .45 * Math.sin(t * .012 + k);
      ctx.beginPath();
      ctx.fillStyle = `rgba(${n.c},${.25 + .35 * pulso})`;
      ctx.arc(n.x * W, n.y * H, 2.1 * devicePixelRatio, 0, 6.283);
      ctx.fill();
    });
    rafRed = requestAnimationFrame(paso);
  };
  paso();
}

});
